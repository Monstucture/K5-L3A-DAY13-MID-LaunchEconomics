# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02) — số in ra từ src/lab13.py
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 3.103 mỗi nhóm -> 42 người mỗi nhóm, tổng 84 > 40 người: không đủ.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa = 20 / 0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300, và chỉ 6 cụm (< 20).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (0,98 + 0,02m) >= 859 -> m >= 299 yêu cầu mỗi người (DE 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: nhân viên cùng depot có thể chia sẻ câu trả lời; khoá trợ lý theo tài khoản, log lượt mở theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: 20 + 20 nhân viên không đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chấp nhận mức chênh 6 điểm, mỗi nhân viên xử lý ít nhất 299 yêu cầu.
#   Nếu tác động thật chỉ 5 điểm, power còn khoảng 0,64. Giám đốc vận hành phải ký chấp nhận trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn bộ 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang 3,97%.
#   Ngưỡng: nhóm trợ lý cao hơn đối chứng >= 2 điểm, hoặc vượt trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang, ở cả 12 depot (0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×) và doi_tac (0,85×)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4 -> 10 -> 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, không dùng trợ lý"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng khoá trợ lý theo tài khoản và log lượt mở theo staff_id"
    predeclared: "Có: chỉ số chính, mức chênh 6 điểm, luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm hoặc vượt 6%, hoặc có >= 1 ca hoàn hai lần TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở thêm hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ) > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và báo cáo lý do KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như trước pilot"
  decision_date: "2027-01-15"
  simulated_inputs:
    - "phut_xem_lai_simulated: tiền xem lại 1.780.000 đ"
    - "phut_lam_lai_simulated: tiền làm lại 2.264.000 đ, trung bình 15,3 phút mỗi ca"
    - "Chi phí mỗi việc thành công 4.472 đ; phạm vi pilot 3.414 đ, 4.599 đ khi cộng cố định"
    - "So với nhân viên tự làm: 0,49× cả hệ thống; 0,98×-1,03× khi xem lại 100%"
    - "Chi phí theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ"
